[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI knowledge intelligence backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.136.1",
    "pydantic==2.13.2",
    "pydantic-settings==2.14.0",
    "psycopg[binary]==3.3.9",
    "pypdf==7.1.1",
    "sqlalchemy==2.0.49",
    "uvicorn==0.46.0",
]

[dependency-groups]
agents = ["langgraph==1.1.10"]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "ruff==0.15.12",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
markers = ["integration: requires a reachable PostgreSQL test server"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
